# Planbevakningskartan (planer/) publiceras via GitHub Pages, inte Netlify.
# Hoppa över Netlify-bygget när bara planer/ eller den här filen ändrats,
# så att kartuppdateringar inte drar Netlify-krediter (15 per produktionsdeploy).
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)planer' ':(exclude)netlify.toml'"
